# 수집 로봇 — 매일 자동으로 SEC·주가를 받아 저장소에 커밋합니다 (전략.md v2 4장)
#
# · 스케줄: 매일 09:30 UTC (미국 동부 새벽 — 전날 장 마감 후 발표까지 수거)
# · 수동 실행: Actions 탭 → collect → Run workflow (검증·급할 때)
# · 절반 이상 실패한 날은 collect_job 이 종료코드 1 로 멈춰 커밋하지 않습니다

name: collect

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          # 저장소 Secrets 에 SEC_IDENTITY 가 있으면 그 값을, 없으면 config 기본값을 씁니다
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: python collect_job.py

      - name: 변경분 커밋
        run: |
          git config user.name "수집 로봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/measure
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 — $(date -u +%Y-%m-%d) ($(git diff --cached --numstat | wc -l)개 파일)"
            git push
          fi
