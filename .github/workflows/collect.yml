# 수집 로봇 — 매일 자동으로 SEC·주가를 받아 저장소에 커밋합니다 (전략.md v2 4장)
#
# · 스케줄: 매일 09:30 UTC (미국 동부 새벽 — 전날 장 마감 후 발표까지 수거)
# · 수동 실행: Actions 탭 → collect → Run workflow (검증·급할 때)
# · 절반 이상 실패한 날은 collect_job 이 종료코드 1 로 멈춰 커밋하지 않습니다

name: collect

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 3차 확장(160종목, 종목당 ~25초)으로 수집이 ~70분까지 늘어
    # 한도를 늘립니다 (2026-08-13)
    #
    # 4차 확장 배치1 +45 (2026-08-20, 122차): 08-20 런 실측이 232 CPU분 /
    # 일꾼 3 = 벽시계 약 77분(시간 초과 0건)이었습니다. 새 45종목은
    # **캐시가 없어** 첫 수집에서 공시를 통째로 내려받습니다(기존 종목은
    # 캐시 적중 15,978 · 새 내려받기 17건뿐). 한도를 넘기면 그날 수집이
    # 통째로 버려지므로, 넉넉히 300분으로 올립니다.
    #
    # ⚠️ 여기 일꾼을 3 에서 늘리지 말라고 적혀 있었으나 **지금은 6 입니다**
    #    (142차에 올리고 148차에 실측으로 안전을 확인). 08-22 런 계기:
    #    일꾼 6 · 겹침배수 5.93 · 벽시계 140.8분 · **초당 0.28요청**
    #    (SEC 허용 10의 3%) — 99차 429 사고와 거리가 멉니다. 일꾼 수는
    #    config.COLLECT_WORKERS 에서 정합니다. 주석이 코드와 **반대로**
    #    말하고 있었습니다 (150차-G).
    #
    # 5차 확장(401종목, 2026-08-23 첫 런) 예상 벽시계 226분.
    # 시작은 예약(09:30 UTC)보다 늦습니다 — 08-22 실측은 10:29 시작
    # (ran_at 12:50 − 벽시계 140.8분). 깃허브 예약이 약 1시간 밀립니다.
    # 최악이면 300분 한도에 닿습니다.
    # ⚠️ 300 → 350 (150차-AE). 2026-08-23 런이 **정확히 300분에 잘렸습니다.**
    #    실측 내역(로그에서 복사):
    #      8-K 수집  10:03:23 → 14:28:13  = **265분** (400/401 종목 완료)
    #      주가·컨센서스 14:28:57 → 15:02:56 = 34분 (진행 중 취소)
    #      → 필요했던 시간은 약 305분. **5분이 모자랐습니다.**
    #    원인은 5차 확장 151종목의 **첫 수집**입니다 — 캐시가 없어 종목당
    #    100~900초가 걸렸습니다(로그의 "캐시 0/신규 92" 가 그 표시).
    #    캐시가 차면 어제(250종목·캐시 적중)처럼 140분대로 내려갑니다.
    #    깃허브 한도는 360분이므로 350은 안전합니다.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 26차 개선 — 증분 수집: 공시 원문(추출 텍스트)은 불변이므로 실행
      # 캐시로 다음 런에 전달합니다. 매일 런은 공시 목록만 확인하고 못 본
      # 문서만 내려받아 수집 시간이 크게 줄어듭니다. 캐시가 비면(만료 등)
      # 자동으로 예전처럼 전체 수집합니다 — 정확성은 캐시에 의존하지 않음.
      #
      # ⚠️ **복원과 저장을 나눈 이유** (150차-AE, 실제 사고):
      #    예전에는 `actions/cache@v4` 하나로 썼습니다. 그 방식은 저장을
      #    **작업이 성공했을 때만** 합니다. 2026-08-23 런이 300분 한도에
      #    걸려 취소되자 저장 단계가 통째로 건너뛰어져, **4시간 26분 동안
      #    받은 새 151종목 원문이 전부 버려졌습니다.** 다음 날도 캐시가
      #    비어 있으니 똑같이 4시간 반이 걸리고 또 취소됩니다 —
      #    **스스로 못 빠져나오는 덫**이었습니다.
      #
      #    이제 `restore` 로 받아 쓰고, 맨 끝에서 `save` 를 `if: always()`
      #    로 저장합니다. 시간 초과로 취소돼도 그때까지 받은 원문은 남아
      #    다음 런이 이어받습니다.
      - name: 공시 원문 캐시 복원
        id: raw8k
        uses: actions/cache/restore@v4
        with:
          path: data/raw8k
          key: raw8k-v1-${{ github.run_id }}
          restore-keys: |
            raw8k-v1-

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          # 저장소 Secrets 에 SEC_IDENTITY 가 있으면 그 값을, 없으면 config 기본값을 씁니다
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: python collect_job.py

      # ⚠️ **시간 초과로 취소돼도 저장합니다** (150차-AE). 이 한 줄이
      #    "매일 4시간 반 쓰고 아무것도 안 남는" 덫을 끊습니다.
      #    수집 실행 **바로 뒤**에 둡니다 — 웹앱 빌드나 커밋에서 무슨 일이
      #    나도 원문은 이미 저장된 뒤입니다.
      - name: 공시 원문 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw8k
          key: raw8k-v1-${{ github.run_id }}

      # 웹앱(GitHub Pages)용 데이터 (132차) — 수집·판정이 끝난 뒤 만듭니다.
      # 실패해도 그날 **수집 커밋은 막지 않습니다** (데이터가 더 귀합니다).
      - name: 웹앱 데이터 만들기
        continue-on-error: true
        run: python web_build.py

      - name: 변경분 커밋
        run: |
          git config user.name "수집 로봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/measure docs/data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 — $(date -u +%Y-%m-%d) ($(git diff --cached --numstat | wc -l)개 파일)"
            # push 거부 대비 (실제 사고 2건):
            #  · 2026-08-13: 코드 PR 이 먼저 들어와 거부 — rebase 로 해결됐음
            #  · 2026-08-14: 다른 로봇 커밋이 먼저 들어와 snapshot.json 내용
            #    충돌 — rebase 는 데이터 파일 충돌을 못 풀어 1시간 48분치
            #    수집을 버림. 수집물은 파일 전체 교체 성격이라 병합이 아니라
            #    "최신 그 브랜치 위에 수집분을 통째로 다시 커밋"이 정답입니다.
            #    (컨센서스·서프라이즈 원장은 추가 전용이지만 하루 한 번
            #    규칙이라 같은 날 두 런의 원장 내용은 동일 — 통째 승리 안전)
            #  · 2026-08-15: 이 되돌리기가 origin/main 으로 **하드코딩**돼
            #    있었습니다. 검증하려고 브랜치에서 수동 실행하면 그 브랜치를
            #    main 으로 되돌려 버려 수집분과 코드가 함께 날아갑니다.
            #    → 지금 돌고 있는 브랜치(GITHUB_REF_NAME)로 되돌립니다.
            BRANCH="${GITHUB_REF_NAME:-main}"
            echo "대상 브랜치: $BRANCH"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$BRANCH"; then break; fi
              [ "$attempt" = 3 ] && { echo "3회 실패"; exit 1; }
              echo "push 거부 — 최신 $BRANCH 위에 수집분 재커밋 ($attempt/3)"
              rm -rf /tmp/collected_backup /tmp/web_backup
              cp -r data/measure /tmp/collected_backup
              [ -d docs/data ] && cp -r docs/data /tmp/web_backup
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              rm -rf data/measure docs/data
              mv /tmp/collected_backup data/measure
              [ -d /tmp/web_backup ] && mkdir -p docs && mv /tmp/web_backup docs/data
              git add data/measure docs/data
              git commit -m "자동 수집 — $(date -u +%Y-%m-%d) (충돌 재커밋)"
            done
          fi
