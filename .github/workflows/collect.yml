# 수집 로봇 — 매일 자동으로 SEC·주가를 받아 저장소에 커밋합니다 (전략.md v2 4장)
#
# · 스케줄: 매일 09:30 UTC (미국 동부 새벽 — 전날 장 마감 후 발표까지 수거)
# · 수동 실행: Actions 탭 → collect → Run workflow (검증·급할 때)
# · 절반 이상 실패한 날은 collect_job 이 종료코드 1 로 멈춰 커밋하지 않습니다

name: collect

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 3차 확장(160종목, 종목당 ~25초)으로 수집이 ~70분까지 늘어
    # 한도를 늘립니다 (2026-08-13)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          # 저장소 Secrets 에 SEC_IDENTITY 가 있으면 그 값을, 없으면 config 기본값을 씁니다
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: python collect_job.py

      - name: 변경분 커밋
        run: |
          git config user.name "수집 로봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/measure
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 — $(date -u +%Y-%m-%d) ($(git diff --cached --numstat | wc -l)개 파일)"
            # 로봇이 도는 30~40분 사이 main 에 다른 커밋(PR 머지)이 들어오면
            # push 가 거부되어 그날 수집이 통째로 버려집니다 (2026-08-13 실제 사고
            # — 17개 파일 수집 성공 후 push 거부). 로봇의 변경은 data/measure
            # 뿐이라 코드와 충돌하지 않으므로, rebase 후 다시 밉니다 (3회 시도).
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push 거부 — main 을 당겨 rebase 후 재시도 ($attempt/3)"
              git pull --rebase origin main || exit 1
              [ "$attempt" = 3 ] && { echo "3회 실패"; exit 1; }
            done
          fi
