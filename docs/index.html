<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>상승 섹터 포착</title>
<link rel="manifest" href="manifest.json">
<!-- 아이콘을 글자로 그려 넣습니다 — 바깥에서 파일을 받아오지 않습니다 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e11'/%3E%3Cpath d='M5 22 L12 14 L18 18 L27 8' stroke='%2300c805' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 맨 위 — 언제 수집한 데이터인지 항상 보이게 (정직화) -->
<header id="top">
  <div class="ttl">상승 섹터 포착</div>
  <div class="sub" id="stamp">불러오는 중…</div>
</header>

<main id="view"><div class="loading">불러오는 중…</div></main>

<!-- 아래 고정 탭 — 로빈후드처럼 엄지로 닿는 자리 -->
<nav id="tabs">
  <a href="#/home" data-tab="home"><span>🏠</span>주도</a>
  <a href="#/market" data-tab="market"><span>📈</span>장세</a>
  <a href="#/stocks" data-tab="stocks"><span>🔎</span>종목</a>
  <a href="#/check" data-tab="check"><span>🧾</span>검증</a>
</nav>

<!-- 화면 코드를 **캐시에서 꺼내 쓰지 않도록** 시각을 붙여 부릅니다 (150차-AW).
     주소를 그대로(시각 없이) 두었더니, 화면을 고쳐 올려도 휴대폰이
     예전에 받아 둔 app.js 를 계속 써서 **옛 화면이 그대로 남았습니다**
     (주인이 08-25 에 옛 안내문을 보고 알려 주었습니다).
     한 시간 단위로 주소를 바꿔, 늦어도 한 시간이면 새 화면이 옵니다. -->
<script>
  (function () {
    var s = document.createElement("script");
    s.src = "app.js?v=" + Math.floor(Date.now() / 3600000);
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
